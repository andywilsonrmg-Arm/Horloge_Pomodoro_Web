<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">




    <title>Méthode Pomodoro</title>
</head>

<body>
    <h1>Pomodoro</h1>
    <div class="affichage">
        <div class="bloc travail">
            <p>TRAVAIL</p>
            <p class="affichageT"></p>
        </div>
        <div class="bloc pause">
            <p>REPOS</p>
            <p class="affichageP"></p>
        </div>
    </div>

    <div class="container-btns">
        <button class="b1"> <img src="play-button.png">
            Commencer</button>
        <button class="b2">
            <img src="pause-button.png"><br>
            Pause</button>
        <button class="b3"><img src="refresh.png">
            Réinitialiser
        </button>
    </div>
    <h2></h2>
    <script src="App.js"></script>
</body>

</html>
